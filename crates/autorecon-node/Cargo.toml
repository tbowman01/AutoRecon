[package]
name = "autorecon-node"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js native bindings for AutoRecon via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
autorecon-core = { path = "../autorecon-core" }
napi = { workspace = true, features = ["async", "tokio_rt"] }
napi-derive = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
strip = "symbols"
